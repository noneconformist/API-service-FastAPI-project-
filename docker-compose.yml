services:

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head"
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: "redis_${CI_PIPELINE_ID}"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy # Wait until db becomes "healthy"
      redis:
        condition: service_healthy
    command: >
          sh -c "uvicorn main:app --host 0.0.0.0 --port 8080"

  db:
    image: postgres:15
    volumes:
      - db_data:${PG_DATA}
    env_file:
      - .env
    ports: []
      #- "5433:5432"
    healthcheck:  # Adding a status check
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
    ports: []
      #- "8080:80"
    depends_on:
      - app

  test:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pytest --disable-warnings --maxfail=1"

volumes:
  db_data:
