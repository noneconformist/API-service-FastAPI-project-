[project]
name = "task_24_logging_level_determination"
version = "0.1.0"
description = "API serviсe"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "python-dotenv>=1.2.1",
    "psycopg[binary]>=3.2.1",
    "psycopg[pool]>=3.2.1",
    "authx>=1.5.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "ipython>=9.9.0",
    "alembic>=1.18.0",
    "asyncpg==0.31.0",
    "sqlalchemy-utils==0.42.1",
    "redis==7.4.0"
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.10",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.19.1",
]

# Ruff settings
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "uv.lock",
    ".python-version",
    ".gitignore",
    ".dockerignore",
    "requirements.txt",
]
extend-exclude = ["migrations"]

[tool.alembic]
script_location = "migrations"

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
